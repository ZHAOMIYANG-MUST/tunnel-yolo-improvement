# 改进实验②-B：YOLOv8n + 坐标注意力 CA（Hou et al., CVPR 2021）
#
# 为什么换掉 CBAM：实验②-A（CBAM）测试集 mAP50 0.953、mAP50-95 0.727，
# 相对 WIoU 单版（0.959 / 0.740）不升反降，属于无效改进。
# 分析认为 CBAM 的空间注意力用 7×7 方形卷积，感受野各向同性，与本数据集
# "纵向贯穿长条"（23% 的框高度≈1.0）的形态不匹配。
#
# CA 的做法：沿高度、宽度两个方向分别做一维池化，把方向相关的位置信息
# 编码成两组注意力权重——对细长/纵向目标天然更敏感。
#
# 插入位置与 CBAM 版**完全一致**（主干末端 1 处 + 颈部三个检测分支前各 1 处），
# 保证"唯一变量 = 注意力模块类型"，两组实验可直接对比。
#
# 通道数为 width=0.25 缩放后的实际值，depth/width_multiple=1.0（与官方 yolov8n 等价）。
# 校验：本结构（nc=1）参数量 3,029,443，其中 CA 增加 18,400（+0.61%），GFLOPs 不变。

nc: 1
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C2f, [32, True]] # 2
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C2f, [64, True]] # 4
  - [-1, 1, Conv, [128, 3, 2]] # 5-P4/16
  - [-1, 2, C2f, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]] # 7-P5/32
  - [-1, 1, C2f, [256, True]] # 8
  - [-1, 1, SPPF, [256, 5]] # 9
  - [-1, 1, CoordAtt, [256]] # 10  ← 新增：主干末端

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 1, C2f, [128]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 1, C2f, [64]] # 16 (P3/8-small)
  - [-1, 1, CoordAtt, [64]] # 17  ← 新增：P3 分支
  - [-1, 1, Conv, [64, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 1, C2f, [128]] # 20 (P4/16-medium)
  - [-1, 1, CoordAtt, [128]] # 21  ← 新增：P4 分支
  - [-1, 1, Conv, [128, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23 cat head P5
  - [-1, 1, C2f, [256]] # 24 (P5/32-large)
  - [-1, 1, CoordAtt, [256]] # 25  ← 新增：P5 分支
  - [[17, 21, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
