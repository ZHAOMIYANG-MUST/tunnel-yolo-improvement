# 改进实验②：YOLOv8n + CBAM 注意力（Woo et al., ECCV 2018）
#
# 相对官方 yolov8n 的改动：插入 4 个 CBAM（主干末端 1 处 + 颈部三个检测分支前各 1 处），
# 让网络在输出特征图上重新加权通道与空间位置，抑制低对比度背景造成的误检。
#
# 重要说明：官方 yolov8.yaml 写的是未缩放通道（64/128/256/512/1024）+ scales: n: [0.33, 0.25, 1024]，
# 由框架按 depth=0.33 / width=0.25 缩放。本文件把缩放后的**实际值**直接写死
# （通道 16/32/64/128/256，C2f 重复次数 1/2/2/1），并置 depth_multiple = width_multiple = 1.0，
# 两者等价、得到的结构与官方 yolov8n 完全一致——这样 CBAM 的参数（通道数）也不会被缩放，避免通道不匹配。
# 校验：本结构（nc=1）参数量应为 3.03M 左右，与基线 YOLOv8n 的 3.01M 相当（CBAM 约 +2 万参数）。

nc: 1
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C2f, [32, True]] # 2
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C2f, [64, True]] # 4
  - [-1, 1, Conv, [128, 3, 2]] # 5-P4/16
  - [-1, 2, C2f, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]] # 7-P5/32
  - [-1, 1, C2f, [256, True]] # 8
  - [-1, 1, SPPF, [256, 5]] # 9
  - [-1, 1, CBAM, [256]] # 10  ← 新增：主干末端

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 1, C2f, [128]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 1, C2f, [64]] # 16 (P3/8-small)
  - [-1, 1, CBAM, [64]] # 17  ← 新增：P3 分支
  - [-1, 1, Conv, [64, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 1, C2f, [128]] # 20 (P4/16-medium)
  - [-1, 1, CBAM, [128]] # 21  ← 新增：P4 分支
  - [-1, 1, Conv, [128, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23 cat head P5
  - [-1, 1, C2f, [256]] # 24 (P5/32-large)
  - [-1, 1, CBAM, [256]] # 25  ← 新增：P5 分支
  - [[17, 21, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
